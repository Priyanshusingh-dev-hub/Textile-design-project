name: UI screenshots

on:
  push:
    branches: [feat/orange-white-studio-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start backend
        run: |
          cd backend
          (python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 > /tmp/loomlab-backend.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8003/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8003/api/health
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture real workflow screenshots
        working-directory: frontend
        run: |
          (npx vite preview --host 127.0.0.1 > /tmp/loomlab-vite.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/loomlab-vite.log
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
          await page.screenshot({ path: 'loomlab-01-upload.png', fullPage: true });
          await page.getByRole('button', { name: /Try a sample/i }).click();
          await page.waitForFunction(() => document.querySelector('main img')?.getAttribute('src'), null, { timeout: 30000 });
          await page.waitForTimeout(1500);
          await page.screenshot({ path: 'loomlab-02-sample.png', fullPage: true });
          await page.getByRole('button', { name: /Continue to Reduce/i }).click();
          await page.getByRole('button', { name: /Reduce design/i }).click();
          await page.waitForFunction(() => [...document.querySelectorAll('button')].some(b => /Separate into plates/i.test(b.textContent || '') && !b.disabled), null, { timeout: 60000 });
          await page.waitForTimeout(1000);
          await page.screenshot({ path: 'loomlab-03-reduce.png', fullPage: true });
          await page.getByRole('button', { name: /Separate into plates/i }).click();
          await page.waitForTimeout(3000);
          await page.screenshot({ path: 'loomlab-04-separate.png', fullPage: true });
          await browser.close();
          EOF
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: loomlab-ui-screenshots
          path: |
            frontend/loomlab-*.png
          if-no-files-found: error
          retention-days: 7
