name: UI screenshots

on:
  push:
    branches: [feat/orange-white-studio-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture actual LoomLab UI modes
        working-directory: frontend
        run: |
          (npx vite --host 127.0.0.1 > /tmp/loomlab-vite.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/loomlab-vite.log
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          page.on('console', msg => { if (msg.type() === 'error') console.log('BROWSER:', msg.text()); });
          await page.goto('http://127.0.0.1:5173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(1000);
          await page.screenshot({ path: 'loomlab-01-upload.png', fullPage: true });
          await page.getByRole('tab', { name: /Line art \+ reference/i }).click();
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'loomlab-02-lineart.png', fullPage: true });
          await page.getByRole('tab', { name: /Numbered sketch \+ mill file/i }).click();
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'loomlab-03-numbered-sketch.png', fullPage: true });
          await page.getByRole('button', { name: /Settings/i }).click();
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'loomlab-04-settings.png', fullPage: true });
          await browser.close();
          EOF
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: loomlab-ui-screenshots
          path: |
            frontend/loomlab-*.png
          if-no-files-found: error
          retention-days: 7
