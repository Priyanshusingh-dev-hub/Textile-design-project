# Builds the one-file Windows app (LoomLab-Studio.exe), starts it, runs
# packaging/smoke_test.py against it and uploads it as a download on the run.
# Pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# also publishes it on the repository's Releases page.
name: Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the tag-only release step
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt
      - run: python -m pip install -r backend/requirements.txt -r packaging/requirements-build.txt

      - name: Build LoomLab-Studio.exe
        run: pyinstaller --noconfirm packaging/loomlab.spec

      - name: Start the app and smoke-test it
        env:
          DATA_DIR: ${{ runner.temp }}\loomlab-data
        run: |
          $app = Start-Process -FilePath dist\LoomLab-Studio.exe -ArgumentList '--no-browser','--port','8123' -PassThru
          python packaging/smoke_test.py http://127.0.0.1:8123/
          $code = $LASTEXITCODE
          taskkill /PID $app.Id /T /F | Out-Null
          exit $code

      - uses: actions/upload-artifact@v6
        with:
          name: LoomLab-Studio-windows
          path: dist/LoomLab-Studio.exe
          if-no-files-found: error

      - name: Publish the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG dist/LoomLab-Studio.exe --clobber }
          else { gh release create $env:TAG dist/LoomLab-Studio.exe --title "LoomLab Studio $env:TAG" --generate-notes }
