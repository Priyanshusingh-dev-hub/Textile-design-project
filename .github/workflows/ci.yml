# Every push and pull request runs the same checks a contributor runs locally
# (see CLAUDE.md). The backend also runs on Windows, because that is where
# mills run LoomLab (run-windows.bat) and fonts and paths differ there.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # numpy 2.3 needs 3.11+; the launcher accepts 3.11-3.13
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: frontend type-check, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: no network assets in the app (golden rule 4)
        run: "! grep -rnE 'https?://' src --include='*.ts' --include='*.tsx' --include='*.css' | grep -v '\\.test\\.ts'"
